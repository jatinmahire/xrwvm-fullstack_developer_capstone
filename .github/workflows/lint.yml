name: Lint Code
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install flake8
      - name: Print working directory
        run: pwd
      - name: Run Linter
        run: flake8 server --jobs=1 --extend-exclude=node_modules --max-line-length=120 --extend-ignore=E203,W503
  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JSHint
        run: npm ci
      - name: Run Linter
        run: npm run lint
